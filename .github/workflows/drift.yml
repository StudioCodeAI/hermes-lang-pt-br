name: drift

# Weekly (and on demand) check that the catalogs still match hermes-agent.
#
# This is information, not enforcement: it never writes to the repo and never
# changes an installed copy. It opens (or updates) ONE issue when `main` adds
# keys we do not translate yet, or drops keys we still carry, so staying in sync
# is a reminder instead of a discovery.
#
# The catalogue contract is explicit — a listed plugin must not update itself
# ("No self-updating code"): new versions reach users only through a SHA-bump PR
# in hermes-agent plus `hermes plugins update`.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Install the checker's dependency
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3

      - name: Build the drift report
        id: report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python tools/drift.py | tee report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'stale keys detected' report.md; then
            echo "drift=1" >> "$GITHUB_OUTPUT"
          else
            echo "drift=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the drift issue
        if: steps.report.outputs.drift == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="i18n drift: catalogs behind hermes-agent"
          {
            cat report.md
            printf '\n\n---\n\nOpened by `.github/workflows/drift.yml`. Sync with\n'
            printf '`python tools/build-desktop-pack.mjs` + translate the new keys, then bump the\n'
            printf 'catalog pin in a new PR to NousResearch/hermes-agent.\n'
          } > body.md
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file body.md
          fi
