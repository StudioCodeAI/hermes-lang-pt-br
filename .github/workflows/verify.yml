name: verify

# The pack is plain catalogs, so the check is: every key still exists in the
# English reference of hermes-agent, every leaf is text, and the core
# {placeholders} still match. tools/verify_pack.py fetches the reference from
# the hermes-agent repository over HTTPS — no Hermes install, no clone.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: hermes-agent revision to check against
        required: false
        default: main

jobs:
  catalogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Install the checker's dependency
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3

      - name: Verify the catalogs against hermes-agent
        run: python tools/verify_pack.py --min-desktop-coverage 0.80 --ref "${{ github.event.inputs.ref || 'main' }}"

      - name: Upload the JSON report
        if: always()
        run: python tools/verify_pack.py --json --min-desktop-coverage 0.80 > verify-report.json

      - uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a # v4.3.6
        if: always()
        with:
          name: verify-report
          path: verify-report.json
