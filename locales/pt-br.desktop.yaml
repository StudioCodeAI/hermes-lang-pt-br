settings.fieldDescriptions.browser.useRealProfile: "A navegação local usa os seus logins reais. O Hermes copia o perfil do seu navegador padrão (cookies, logins, preferências) para um snapshot gerenciado e o conduz com o Chromium embutido; o seu perfil ativo nunca é aberto diretamente, e a cópia é atualizada a partir dele a cada execução. Também permite que o agente abra uma sessão local com o perfil real quando solicitado, mesmo com um backend de navegador na nuvem configurado. Só navegadores Chromium são compatíveis (Chrome, Edge, Brave, Brave Origin, Chromium); um navegador padrão que não seja Chromium falha com uma mensagem clara. Desativado por padrão."
settings.fieldDescriptions.checkpoints.enabled: "Cria snapshots de reversão antes de editar arquivos."
settings.fieldDescriptions.codeExecution.mode: "Quão estritamente a execução de código fica restrita ao projeto atual."
settings.fieldDescriptions.compression.codexGpt55Autoraise: "Eleva a compactação para 85% nos modelos compatíveis do ChatGPT Codex com OAuth."
settings.fieldDescriptions.compression.enabled: "Resume o contexto mais antigo quando as conversas ficam grandes."
settings.fieldDescriptions.context.engine: "Estratégia para gerenciar conversas longas perto do limite de contexto."
settings.fieldDescriptions.desktop.repoScanEnabled: "Procura repositórios Git nas pastas locais para exibi-los em Projetos."
settings.fieldDescriptions.desktop.repoScanExcludePaths: "Pastas, e tudo dentro delas, a ignorar durante a descoberta de repositórios."
settings.fieldDescriptions.desktop.repoScanRoots: "Pastas a varrer. Deixe vazio para varrer o seu diretório pessoal."
settings.fieldDescriptions.display.personality: "Estilo padrão do assistente para novas sessões."
settings.fieldDescriptions.display.showReasoning: "Mostra as seções de raciocínio quando o backend as fornece."
settings.fieldDescriptions.fallbackProviders: "Entradas de provedor:modelo reserva a tentar se o modelo padrão falhar."
settings.fieldDescriptions.fileReadMaxChars: "Máximo de caracteres que o Hermes pode ler em uma única solicitação de arquivo."
settings.fieldDescriptions.memory.memoryEnabled: "Salva memórias duráveis que podem ajudar em sessões futuras."
settings.fieldDescriptions.memory.userProfileEnabled: "Mantém um perfil compacto das preferências do usuário."
settings.fieldDescriptions.model: "Usado em novos chats, a menos que você escolha outro modelo no campo de mensagem."
settings.fieldDescriptions.modelContextLength: "Substitui a janela de contexto detectada apenas do modelo PRINCIPAL do chat (em tokens). Deixe em 0 para usar o valor detectado do modelo selecionado. Não afeta os modelos auxiliares nem os de MoA."
settings.fieldDescriptions.security.redactSecrets: "Oculta segredos detectados do conteúdo visível ao modelo, quando possível."
settings.fieldDescriptions.stt.echoTranscripts: "Publica de volta no chat a transcrição bruta 🎙️ das mensagens de voz."
settings.fieldDescriptions.stt.elevenlabs.languageCode: "Código de idioma ISO-639-3 opcional. Em branco, a ElevenLabs detecta automaticamente."
settings.fieldDescriptions.stt.enabled: "Ativa a transcrição de fala local ou por provedor."
settings.fieldDescriptions.stt.streaming: "Mostra o texto enquanto você fala (OpenAI, xAI, ElevenLabs). Volta para a gravação em caso de qualquer falha."
settings.fieldDescriptions.terminal.cwd: "Pasta de projeto padrão para o trabalho com ferramentas e terminal."
settings.fieldDescriptions.terminal.daytonaImage: "Imagem usada quando o backend de execução é o Daytona."
settings.fieldDescriptions.terminal.dockerImage: "Imagem de contêiner usada quando o backend de execução é o Docker."
settings.fieldDescriptions.terminal.envPassthrough: "Variáveis de ambiente a repassar para a execução de ferramentas."
settings.fieldDescriptions.terminal.modalImage: "Imagem usada quando o backend de execução é o Modal."
settings.fieldDescriptions.terminal.persistentShell: "Mantém o estado do shell entre comandos quando o backend oferece suporte."
settings.fieldDescriptions.terminal.singularityImage: "Imagem usada quando o backend de execução é o Singularity."
settings.fieldDescriptions.timezone: "Identificador de fuso horário IANA. Em branco, usa o fuso do sistema."
settings.fieldDescriptions.tts.neutts.device: "Dispositivo de inferência local do NeuTTS."
settings.fieldDescriptions.tts.xai.autoSpeechTags: "Permite que um LLM insira tags de áudio expressivas ([laughing], [sighs]) no roteiro antes da síntese."
settings.fieldDescriptions.tts.xai.bitRate: "Taxa de bits do MP3 em bps. Só se aplica quando o codec é mp3."
settings.fieldDescriptions.tts.xai.language: "Código do idioma falado (ex.: en, pt-BR) ou “auto” para detecção automática."
settings.fieldDescriptions.tts.xai.optimizeStreamingLatency: "Equilíbrio entre latência e qualidade. 0 = melhor qualidade, 2 = menor latência."
settings.fieldDescriptions.tts.xai.sampleRate: "Taxa de amostragem do áudio em Hz. Mais alta = melhor qualidade, arquivos maiores."
settings.fieldDescriptions.tts.xai.speed: "Velocidade de reprodução. 0,7 = mais lenta, 1,0 = normal, 1,5 = mais rápida."
settings.fieldDescriptions.tts.xai.voiceId: "ID de voz da xAI (ex.: eve) ou um ID de voz personalizado."
settings.fieldDescriptions.updates.nonInteractiveLocalChanges: "Quando o Hermes se atualiza pelo app (sem prompt no terminal), mantém as edições locais do código-fonte (stash) ou as descarta (discard). As atualizações pelo terminal sempre perguntam."
settings.fieldDescriptions.voice.autoTts: "Fala as respostas do assistente automaticamente."
settings.fieldDescriptions.voice.gptLive.instructions: "Frases extras para a persona de voz ao vivo (tom, ritmo, idioma). O Hermes mantém o próprio prompt de sistema."
settings.fieldDescriptions.voice.gptLive.voice: "Voz do modo GPT-Live. IDs de voz personalizados são aceitos."
settings.fieldDescriptions.voice.voiceChatMode: "chained: fala para texto → Hermes → texto para fala, com os provedores abaixo. gpt-live: um único modelo de voz full-duplex da OpenAI (gpt-live-1) ouve e fala, e entrega cada pedido real ao Hermes: qualquer modelo selecionado responde, com o conjunto completo de ferramentas. Requer uma chave de API da OpenAI; a camada de voz cobra US$ 0,05 por minuto."
