explainer.empty_response: "{model} não produziu uma resposta desta vez, mesmo após novas tentativas. Envie `continue` para tentar novamente ou troque de modelo com /model."
explainer.exit.all_retries_exhausted_no_response: "o fornecedor do modelo não respondeu após todas as tentativas. Envie /retry ou troque de modelo com /model."
explainer.exit.budget_exhausted: "o orçamento de iterações/custo por turno se esgotou antes de uma resposta final. Envie `continue` para prosseguir."
explainer.exit.error_near_max_iterations: "ocorreu um erro perto do limite de iterações, antes de uma resposta final. Verifique a saída da ferramenta acima e então envie `continue`."
explainer.exit.fallback_prior_turn_content: "nenhum conteúdo novo foi produzido neste turno; exibindo o contexto anterior recuperado. Envie `continue` para tentar novamente."
explainer.exit.interrupted_during_api_call: "a solicitação foi interrompida no meio da chamada, antes de uma resposta ser recebida. Envie `continue` para tentar novamente."
explainer.exit.max_iterations_reached: "o limite máximo de iterações de ferramenta foi atingido antes de uma resposta final. Envie `continue` para prosseguir ou aumente `max_iterations`."
explainer.exit.ollama_runtime_context_too_small: "a janela de contexto do modelo local era pequena demais para concluir. Aumente o tamanho do contexto ou use um modelo maior."
explainer.exit.partial_stream_recovery: "o streaming parou antes do fim e apenas uma resposta parcial foi recuperada. Envie `continue` para retomar de onde parou."
explainer.exit.pending_tool_result: "o turno foi encerrado enquanto um resultado de ferramenta ainda estava pendente e o modelo não produziu texto de continuação. Envie `continue` para que ele resuma."
explainer.exit.rebuilt_restart_limit_exceeded: "todos os fornecedores da cadeia de fallback continuaram falhando em sequência, então o turno foi encerrado em vez de tentar novamente para sempre. Envie `continue` ou troque de fornecedor."
explainer.exit.redirect_restart_limit_exceeded: "a solicitação foi cancelada por uma nova correção em todas as tentativas, então o turno foi encerrado em vez de tentar novamente para sempre. Sua última correção está na fila como a próxima mensagem."
explainer.exit.repeated_outer_errors: "o turno continuou falhando com erros repetidos e foi encerrado antecipadamente em vez de tentar novamente para sempre. Verifique os erros acima e então envie `continue` para tentar de novo."
explainer.file_mutation.entry: "  • `{path}` — [{tool}] {preview}"
explainer.file_mutation.failed: "falhou"
explainer.file_mutation.header: "⚠️ Verificador de mutação de arquivos: {count} edição(ões) de arquivo FALHOU(ARAM) neste turno, apesar de qualquer redação acima que sugira o contrário. Execute `git status` ou `read_file` para confirmar o que realmente foi aplicado."
explainer.no_reply_prefix: "⚠️ Sem resposta: "
explainer.persistence.compression: "o turno foi encerrado porque outro processo estava comprimindo esta sessão. Sua mensagem já deve estar salva — envie-a novamente quando a compressão terminar."
explainer.persistence.compression_closed: "o turno foi encerrado porque esta sessão foi rotacionada pela compressão de contexto e sua continuação ativa não pôde ser adotada. O armazenamento em si está íntegro — atualize o cliente (ou inicie um novo turno) para que ele use o novo id de sessão e então envie sua mensagem novamente."
explainer.persistence.corrupt: "o turno foi encerrado porque o banco de dados de estado relatou corrupção estrutural (a transcrição teria sido perdida na reinicialização). Liberar espaço em disco não vai ajudar. Opções de recuperação:\n1. Execute `hermes {profile_arg}doctor --fix`\n2. Pare o gateway e então recupere com:\n   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   (se indicar que é recuperável) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — a recuperação cria um instantâneo do arquivo danificado antes; NÃO execute `sqlite3 ... \".recover\"` contra o state.db ativo, pois um CLI sqlite3 vulnerável pode corrompê-lo ainda mais\n3. Restaure a partir de um backup em {backups_dir}/\nDepois envie sua mensagem novamente."
explainer.persistence.default: "o Hermes não conseguiu salvar esta conversa, então parou em vez de perder suas mensagens. Causas possíveis: o disco está sem espaço ou outro processo do Hermes está segurando o banco de dados. Feche outras janelas do Hermes, execute `hermes {profile_arg}doctor` para verificar o armazenamento e então envie sua mensagem novamente."
explainer.persistence.deleted_wal: "outro processo do Hermes ainda mantém uma cópia antiga do write-ahead log do banco de dados de sessões, então o Hermes parou de gravar para manter o arquivo seguro e esta mensagem não foi salva (uma cópia fica guardada em {home}/sessions/). Nada foi perdido. Encerre todos os processos do Hermes neste perfil (app Desktop, `hermes {profile_arg}gateway stop`, painel, cron), execute `hermes {profile_arg}doctor` — ele indica qualquer processo que ainda esteja segurando o log — depois inicie o Hermes de novo e envie sua mensagem mais uma vez. Não execute `doctor --fix` nem exclua arquivos state.db enquanto eles estiverem em execução. Guia: {recovery_docs}"
explainer.persistence.disk: "o Hermes não conseguiu salvar esta conversa em disco, então parou em vez de perder suas mensagens. O disco provavelmente está cheio: libere espaço (ou corrija as permissões de {home}/state.db) e então envie sua mensagem novamente."
explainer.persistence.fts_index: "o turno foi encerrado porque o índice de busca de sessões (FTS5) está corrompido e não pôde ser desanexado, então esta mensagem não foi salva. O armazenamento de mensagens em si não está danificado: não execute ferramentas de recuperação nem restaure um backup. Execute `hermes {profile_arg}doctor --fix` (ou reinicie o Hermes, que repara o índice ao abrir) e então envie sua mensagem novamente."
explainer.persistence.locked: "o turno foi encerrado porque o armazenamento de sessões estava ocupado (outro processo do Hermes estava gravando no banco de dados de estado). Sua mensagem já deve estar salva — envie-a novamente em instantes."
explainer.persistence.replaced: "o arquivo do banco de dados de sessões foi substituído enquanto o Hermes estava em execução, então esta mensagem não foi salva (uma cópia fica guardada em {home}/sessions/). Pare o Hermes (`hermes {profile_arg}gateway stop`), execute `hermes {profile_arg}doctor` — não `hermes {profile_arg}doctor --fix`, que repararia o arquivo errado no lugar — depois inicie-o de novo e envie sua mensagem mais uma vez. Os passos avançados de recuperação estão no log."
explainer.persistence.session_row_missing: "esta sessão foi excluída do armazenamento enquanto o chat ainda estava aberto, e o Hermes não conseguiu recriá-la, então esta mensagem não foi salva. Envie sua mensagem novamente; se continuar falhando, execute `hermes {profile_arg}doctor`."
