tips.t001: "/bg <prompt> executa uma tarefa em uma sessão separada enquanto a atual fica livre; /btw <question> responde a uma pergunta paralela sobre esta conversa sem interrompê-la."
tips.t002: "/branch ramifica a sessão atual para que você explore outra direção sem perder o progresso."
tips.t003: "/compress comprime manualmente o contexto da conversa quando ela fica longa."
tips.t004: "/rollback lista os pontos de verificação do sistema de arquivos — restaure arquivos modificados pelo agente para qualquer estado anterior."
tips.t005: "/rollback diff 2 mostra o que mudou desde o ponto de verificação 2 sem restaurar nada."
tips.t006: "/rollback 2 src/file.py restaura um único arquivo a partir de um ponto de verificação específico."
tips.t007: "/title \"my project\" dá nome à sua sessão — retome-a depois com /resume ou hermes -c."
tips.t008: "/resume continua de onde você parou em uma sessão nomeada anteriormente."
tips.t009: "/queue <prompt> coloca uma mensagem na fila para o próximo turno sem interromper o atual."
tips.t010: "/undo remove a última troca usuário/assistente da conversa."
tips.t011: "/retry reenvia sua última mensagem — útil quando a resposta do agente não saiu como esperado."
tips.t012: "/verbose alterna a exibição do progresso das ferramentas: off → new → all → verbose."
tips.t013: "/reasoning high aumenta a profundidade de raciocínio do modelo. /reasoning show exibe o raciocínio."
tips.t014: "/fast alterna o processamento prioritário para respostas de API mais rápidas (depende do fornecedor)."
tips.t015: "/yolo pula todas as solicitações de aprovação de comandos perigosos pelo resto da sessão."
tips.t016: "/model permite trocar de modelo no meio da sessão — experimente /model sonnet ou /model gpt-5."
tips.t017: "/model --global altera seu modelo padrão permanentemente."
tips.t018: "/personality pirate define uma personalidade divertida — 14 opções integradas, de kawaii a shakespeare."
tips.t019: "/skin muda o tema da CLI — experimente ares, mono, slate, poseidon ou charizard."
tips.t020: "/statusbar alterna uma barra persistente que mostra modelo, tokens, % de preenchimento do contexto, custo e duração."
tips.t021: "/tools disable browser remove temporariamente as ferramentas de navegador na sessão atual."
tips.t022: "/browser connect conecta as ferramentas de navegador ao seu navegador da família Chromium em execução via CDP."
tips.t023: "/plugins lista os plugins instalados e seu status."
tips.t024: "/cron gerencia tarefas agendadas — configure prompts recorrentes com entrega em qualquer plataforma."
tips.t025: "/reload-mcp recarrega a configuração dos servidores MCP a quente, sem reiniciar."
tips.t026: "/usage mostra o uso de tokens, o detalhamento de custos e a duração da sessão."
tips.t027: "/insights mostra análises de uso dos últimos 30 dias."
tips.t028: "/paste verifica se há uma imagem na área de transferência e a anexa à sua próxima mensagem."
tips.t029: "/profile mostra qual perfil está ativo e seu diretório inicial."
tips.t030: "/config mostra sua configuração atual de forma resumida."
tips.t031: "/stop encerra todos os processos em segundo plano iniciados pelo agente."
tips.t032: "@file:path/to/file.py injeta o conteúdo do arquivo diretamente na sua mensagem."
tips.t033: "@file:main.py:10-50 injeta apenas as linhas 10-50 de um arquivo."
tips.t034: "@folder:src/ injeta a listagem da árvore de um diretório."
tips.t035: "@diff injeta suas alterações git não preparadas (unstaged) na mensagem."
tips.t036: "@staged injeta suas alterações git preparadas (git diff --staged)."
tips.t037: "@git:5 injeta os últimos 5 commits com os patches completos."
tips.t038: "@url:https://example.com busca e injeta o conteúdo de uma página web."
tips.t039: "Digitar @ aciona o preenchimento de caminhos do sistema de arquivos — navegue até qualquer arquivo interativamente."
tips.t040: "Combine várias referências: \"Revise @file:main.py e @file:test.py quanto à consistência.\""
tips.t041: "Alt+Enter insere uma quebra de linha para entrada em várias linhas. (O Windows Terminal intercepta Alt+Enter — use Ctrl+Enter no lugar.)"
tips.t042: "Ctrl+C interrompe o agente. Pressione duas vezes em 2 segundos para forçar a saída."
tips.t043: "Ctrl+Z suspende o Hermes para o segundo plano — execute fg no seu shell para retomar."
tips.t044: "Tab aceita o texto fantasma da sugestão automática ou completa comandos de barra."
tips.t045: "Digite uma nova mensagem enquanto o agente trabalha para interrompê-lo e redirecioná-lo."
tips.t046: "Alt+V cola uma imagem da área de transferência na conversa."
tips.t047: "Colar 5+ linhas salva automaticamente em um arquivo e insere uma referência compacta no lugar."
tips.t048: "hermes -c retoma sua sessão de CLI mais recente. hermes -c \"project name\" retoma pelo título."
tips.t049: "hermes -w cria um worktree git isolado — perfeito para fluxos de trabalho com agentes em paralelo."
tips.t050: "hermes -w -q \"Fix issue #42\" combina o isolamento em worktree com uma consulta única."
tips.t051: "hermes chat -t web,terminal ativa apenas conjuntos de ferramentas específicos para uma sessão focada."
tips.t052: "hermes chat -s github-pr-workflow pré-carrega uma skill na inicialização."
tips.t053: "hermes chat -q \"query\" executa uma única consulta não interativa e sai."
tips.t054: "hermes chat --max-turns 1000 substitui o limite padrão de 500 iterações por turno."
tips.t055: "hermes chat --checkpoints ativa instantâneos do sistema de arquivos antes de cada alteração destrutiva de arquivo."
tips.t056: "hermes --yolo ignora todas as solicitações de aprovação de comandos perigosos durante toda a sessão."
tips.t057: "hermes chat --source telegram marca a sessão para filtragem em hermes sessions list."
tips.t058: "hermes -p work chat executa sob um perfil específico sem alterar seu padrão."
tips.t059: "hermes doctor --fix diagnostica e repara automaticamente problemas de configuração e dependências."
tips.t060: "hermes dump gera um resumo compacto da sua instalação — ótimo para relatórios de bugs."
tips.t061: "hermes config set KEY VALUE direciona segredos automaticamente para o .env e todo o resto para o config.yaml."
tips.t062: "hermes config edit abre o config.yaml no seu editor padrão."
tips.t063: "hermes config check procura opções de configuração ausentes ou obsoletas."
tips.t064: "hermes sessions browse abre um seletor interativo de sessões com busca."
tips.t065: "hermes sessions stats mostra a contagem de sessões por plataforma e o tamanho do banco de dados."
tips.t066: "hermes sessions prune --older-than 30 limpa sessões antigas."
tips.t067: "hermes skills search react --source skills-sh pesquisa no diretório público skills.sh."
tips.t068: "hermes skills check verifica se as skills instaladas do hub têm atualizações upstream."
tips.t069: "hermes skills tap add myorg/skills-repo adiciona uma fonte personalizada de skills no GitHub."
tips.t070: "hermes skills snapshot export setup.json exporta sua configuração de skills para backup ou compartilhamento."
tips.t071: "hermes mcp add github --command npx adiciona servidores MCP pela linha de comando."
tips.t072: "hermes mcp serve executa o próprio Hermes como um servidor MCP para outros agentes."
tips.t073: "hermes auth add permite adicionar várias chaves de API para rotação do pool de credenciais."
tips.t074: "hermes completion bash >> ~/.bashrc ativa o preenchimento com Tab para todos os comandos e perfis."
tips.t075: "hermes logs -f acompanha o agent.log em tempo real. --level WARNING --since 1h filtra a saída."
tips.t076: "hermes backup cria um backup em zip de todo o seu diretório inicial do Hermes."
tips.t077: "hermes profile create coder cria um perfil isolado que se torna um comando próprio."
tips.t078: "hermes profile create work --clone copia sua configuração e chaves atuais para um novo perfil."
tips.t079: "hermes update sincroniza as novas skills incluídas com TODOS os perfis automaticamente."
tips.t080: "hermes gateway install configura o Hermes como um serviço do sistema (systemd/launchd)."
tips.t081: "hermes memory setup permite configurar um fornecedor de memória externo (Honcho, Mem0 etc.)."
tips.t082: "hermes webhook subscribe cria rotas de webhook orientadas a eventos com validação HMAC."
tips.t083: "Economize: hermes tools desativa ferramentas não usadas, hermes skills config enxuga as skills."
tips.t084: "/reasoning low ou /reasoning minimal reduz a profundidade de raciocínio abaixo do padrão (medium) — respostas mais rápidas e baratas."
tips.t085: "hermes models direciona visão, compressão e tarefas auxiliares para modelos mais baratos — corta o custo de tokens em segundo plano em 85%+ sem rebaixar seu modelo de chat principal."
tips.t086: "Defina display.bell_on_complete: true no config.yaml para ouvir um sinal sonoro quando tarefas longas terminarem."
tips.t087: "Defina display.streaming: true para ver os tokens aparecerem em tempo real enquanto o modelo gera."
tips.t088: "Defina display.show_reasoning: true para acompanhar a cadeia de raciocínio do modelo."
tips.t089: "Defina display.compact: true para reduzir o espaço em branco na saída e ver informações mais densas."
tips.t090: "Defina display.busy_input_mode: queue para colocar mensagens na fila em vez de interromper o agente, ou steer para injetá-las durante a execução via /steer."
tips.t091: "Defina display.resume_display: minimal para pular a recapitulação completa da conversa ao retomar uma sessão."
tips.t092: "Defina compression.threshold: 0.50 para controlar quando a compressão automática é acionada (padrão: 50% do contexto)."
tips.t093: "Defina agent.max_turns: 1000 para permitir que o agente execute mais etapas de chamada de ferramenta por turno."
tips.t094: "Defina file_read_max_chars: 200000 para aumentar o conteúdo máximo por chamada de read_file."
tips.t095: "Defina approvals.mode: smart para que um LLM aprove automaticamente comandos seguros e negue automaticamente os perigosos."
tips.t096: "Defina fallback_model no config.yaml para alternar automaticamente para um fornecedor de reserva."
tips.t097: "Defina privacy.redact_pii: true para fazer hash de IDs de usuário e números de telefone antes de enviá-los ao LLM."
tips.t098: "Defina browser.record_sessions: true para gravar automaticamente as sessões de navegador como vídeos WebM."
tips.t099: "Defina worktree: true no config.yaml para sempre criar um worktree git (o mesmo que hermes -w)."
tips.t100: "Defina security.website_blocklist.enabled: true para bloquear domínios específicos nas ferramentas web."
tips.t101: "Defina cron.wrap_response: false para entregar a saída bruta do agente sem o cabeçalho/rodapé do cron."
tips.t102: "HERMES_TIMEZONE substitui o fuso horário do servidor por qualquer string de fuso horário IANA."
tips.t103: "A substituição de variáveis de ambiente funciona no config.yaml: use a sintaxe ${VAR_NAME}."
tips.t104: "Comandos rápidos no config.yaml executam comandos de shell instantaneamente, sem gastar tokens."
tips.t105: "Personalidades personalizadas podem ser definidas no config.yaml em agent.personalities."
tips.t106: "provider_routing controla a ordenação, a lista de permissões e a lista de bloqueio de fornecedores do OpenRouter."
tips.t107: "execute_code executa scripts Python que chamam ferramentas do Hermes programaticamente — os resultados ficam fora do contexto."
tips.t108: "delegate_task inicia até 10 subagentes simultâneos por padrão (delegation.max_concurrent_children) com contextos isolados para trabalho em paralelo."
tips.t109: "web_extract funciona com URLs de PDF — passe qualquer link de PDF e ele converte para markdown."
tips.t110: "search_files usa ripgrep e é mais rápido que grep — use-o em vez do grep no terminal."
tips.t111: "patch usa 9 estratégias de correspondência aproximada, então pequenas diferenças de espaço em branco não quebram as edições."
tips.t112: "patch suporta o formato V4A para edições em massa de vários arquivos em uma única chamada."
tips.t113: "read_file sugere nomes de arquivo semelhantes quando um arquivo não é encontrado."
tips.t114: "read_file desduplica automaticamente — reler um arquivo inalterado retorna um stub leve."
tips.t115: "browser_vision captura uma tela e a analisa com IA — funciona para CAPTCHAs e conteúdo visual."
tips.t116: "browser_console pode avaliar expressões JavaScript no contexto da página."
tips.t117: "image_generate cria imagens com o FLUX 2 Pro e ampliação automática de 2x."
tips.t118: "text_to_speech converte texto em áudio — é reproduzido como mensagens de voz no Telegram."
tips.t119: "send_message pode alcançar qualquer plataforma de mensagens conectada de dentro de uma sessão."
tips.t120: "A ferramenta todo ajuda o agente a acompanhar tarefas complexas de várias etapas durante uma sessão."
tips.t121: "session_search faz busca em texto completo em TODAS as conversas anteriores."
tips.t122: "O agente salva automaticamente preferências, correções e fatos do ambiente na memória."
tips.t123: "/moa encaminha um prompt difícil pelo seu conjunto de modelos Mixture of Agents configurado."
tips.t124: "Os comandos de terminal suportam o modo em segundo plano com notify_on_complete para tarefas de longa duração."
tips.t125: "Os processos de terminal em segundo plano suportam watch_patterns para alertar sobre linhas de saída específicas."
tips.t126: "A ferramenta terminal suporta 6 backends: local, Docker, SSH, Modal, Daytona e Singularity."
tips.t127: "Cada perfil tem sua própria configuração, chaves de API, memória, sessões, skills e tarefas cron."
tips.t128: "Nomes de perfil se tornam comandos de shell — 'hermes profile create coder' cria o comando 'coder'."
tips.t129: "hermes profile export coder -o backup.tar.gz cria um arquivo de perfil portátil."
tips.t130: "Se dois perfis compartilharem por acidente o mesmo token de bot, o segundo gateway é bloqueado com um erro claro."
tips.t131: "As sessões geram títulos descritivos automaticamente após a primeira troca — não é preciso nomear manualmente."
tips.t132: "Os títulos de sessão suportam linhagem: \"my project\" → \"my project #2\" → \"my project #3\"."
tips.t133: "Ao sair, o Hermes imprime um comando de retomada com o ID da sessão e estatísticas."
tips.t134: "hermes sessions export backup.jsonl exporta todas as sessões para backup ou análise."
tips.t135: "hermes -r SESSION_ID retoma qualquer sessão anterior específica pelo seu ID."
tips.t136: "A memória é um instantâneo congelado — as alterações só aparecem no prompt do sistema no início da próxima sessão."
tips.t137: "As entradas de memória são verificadas automaticamente quanto a padrões de injeção de prompt e exfiltração."
tips.t138: "O agente tem dois repositórios de memória: notas pessoais (~2200 caracteres) e perfil do usuário (~1375 caracteres)."
tips.t139: "As correções que você dá ao agente (\"não, faça assim\") costumam ser salvas automaticamente na memória."
tips.t140: "Mais de 80 skills incluídas cobrindo github, creative, mlops, productivity, research e muito mais."
tips.t141: "Toda skill instalada vira automaticamente um comando de barra — digite / para ver todas."
tips.t142: "hermes skills install official/security/1password instala skills opcionais do repositório."
tips.t143: "As skills podem se restringir a sistemas operacionais específicos — algumas só carregam no macOS ou no Linux."
tips.t144: "skills.external_dirs no config.yaml permite carregar skills de diretórios personalizados."
tips.t145: "O agente pode criar suas próprias skills como memória procedural usando skill_manage."
tips.t146: "/plan escreve um plano de implementação em markdown em .hermes/plans/ sem executar nada."
tips.t147: "Tarefas cron podem anexar skills: hermes cron add --skill blogwatcher \"Check for new posts\"."
tips.t148: "Os destinos de entrega do cron incluem telegram, discord, slack, email, sms e mais de 12 outras plataformas."
tips.t149: "Se uma resposta de cron começar com [SILENT], a entrega é suprimida — útil para tarefas só de monitoramento."
tips.t150: "O cron suporta atrasos relativos (30m), intervalos (every 2h), expressões cron e timestamps ISO."
tips.t151: "Tarefas cron rodam em sessões de agente totalmente novas — os prompts precisam ser autossuficientes."
tips.t152: "O modo de voz funciona sem nenhuma chave de API se o faster-whisper estiver instalado (transcrição local gratuita)."
tips.t153: "Cinco fornecedores de TTS disponíveis: Edge TTS (gratuito), ElevenLabs, OpenAI, NeuTTS (local gratuito), MiniMax."
tips.t154: "/voice on ativa o modo de voz na CLI. Ctrl+B alterna a gravação push-to-talk."
tips.t155: "O TTS em streaming reproduz as frases conforme são geradas — sem esperar pela resposta completa."
tips.t156: "Mensagens de voz no Telegram, Discord, WhatsApp e Slack são transcritas automaticamente."
tips.t157: "O Hermes roda em 21 plataformas de mensagens: Telegram, Discord, Slack, WhatsApp, Signal, Matrix, IRC, Microsoft Teams, e-mail e mais."
tips.t158: "hermes gateway install o configura como serviço do sistema que inicia junto com a máquina."
tips.t159: "O DingTalk usa Stream Mode — sem webhooks nem URL pública."
tips.t160: "O BlueBubbles traz o iMessage ao Hermes por meio de um servidor macOS local."
tips.t161: "Rotas de webhook suportam validação HMAC, limitação de taxa e filtragem de eventos."
tips.t162: "O servidor de API expõe um endpoint compatível com OpenAI que funciona com Open WebUI e LibreChat."
tips.t163: "Modo de canal de voz do Discord: o bot entra no canal, transcreve a fala e responde falando."
tips.t164: "group_sessions_per_user: true dá a cada pessoa sua própria sessão em chats de grupo."
tips.t165: "/sethome marca um chat como canal principal para entregas de tarefas cron."
tips.t166: "O gateway suporta tempos limite baseados em inatividade — agentes ativos podem rodar indefinidamente."
tips.t167: "A aprovação de comandos perigosos tem 4 níveis: once, session, always (lista de permissões permanente), deny."
tips.t168: "O modo de aprovação inteligente usa um LLM para aprovar automaticamente comandos seguros e sinalizar os perigosos."
tips.t169: "A proteção contra SSRF bloqueia redes privadas, loopback, link-local e endereços de metadados de nuvem."
tips.t170: "Os IDs de sessão têm prefixo de data e hora (20250305_091523_abcd), então a ordenação funciona naturalmente em ls e jq."
tips.t171: "Subprocessos MCP recebem um ambiente filtrado — só variáveis seguras do sistema passam."
tips.t172: "Arquivos de contexto (.hermes.md, AGENTS.md) passam por varredura de segurança contra injeção de prompt antes de carregar."
tips.t173: "command_allowlist no config.yaml aprova permanentemente padrões específicos de comandos shell."
tips.t174: "O contexto é comprimido automaticamente ao atingir o limiar — memórias são gravadas e o histórico é resumido."
tips.t175: "A barra de status fica amarela, depois laranja e depois vermelha conforme o contexto se preenche."
tips.t176: "SOUL.md é o arquivo de identidade principal do agente — personalize-o para moldar o comportamento."
tips.t177: "O Hermes carrega o contexto do projeto de .hermes.md, AGENTS.md, CLAUDE.md ou .cursorrules (primeiro encontrado)."
tips.t178: "Arquivos AGENTS.md em subdiretórios são descobertos progressivamente conforme o agente navega pelas pastas."
tips.t179: "Arquivos de contexto são limitados a 20.000 caracteres com truncamento inteligente de início/fim."
tips.t180: "Cinco fornecedores de navegador: Chromium local, Browserbase, Browser Use, Camofox e Firecrawl."
tips.t181: "O Camofox é um navegador antidetecção — um fork do Firefox com falsificação de fingerprint em C++."
tips.t182: "browser_navigate retorna um instantâneo da página automaticamente — não é preciso chamar browser_snapshot depois."
tips.t183: "browser_vision com annotate=true sobrepõe rótulos numerados aos elementos interativos."
tips.t184: "hermes mcp abre um seletor interativo de MCPs aprovados pela Nous que você instala com uma tecla."
tips.t185: "hermes mcp catalog lista os servidores MCP aprovados pela Nous que acompanham o repositório."
tips.t186: "hermes mcp install <name> instala uma entrada do catálogo, pede as credenciais e permite escolher quais ferramentas ativar."
tips.t187: "Servidores MCP são configurados no config.yaml — transportes stdio e HTTP suportados."
tips.t188: "Filtragem de ferramentas por servidor: tools.include permite e tools.exclude bloqueia ferramentas específicas."
tips.t189: "Servidores MCP geram conjuntos de ferramentas automaticamente em tempo de execução — hermes tools pode alterná-los por plataforma."
tips.t190: "Suporte a OAuth no MCP: auth: oauth ativa a autorização pelo navegador com PKCE."
tips.t191: "Checkpoints têm custo zero quando nenhum arquivo é modificado — ativados por padrão."
tips.t192: "Um instantâneo pré-reversão é salvo automaticamente para que você possa desfazer o desfazer."
tips.t193: "/rollback também desfaz o turno da conversa, para que o agente não se lembre das alterações revertidas."
tips.t194: "Checkpoints usam repositórios-sombra em ~/.hermes/checkpoints/ — o .git do seu projeto nunca é tocado."
tips.t195: "batch_runner.py processa centenas de prompts em paralelo para gerar dados de treinamento."
tips.t196: "hermes chat -Q ativa o modo silencioso para uso programático — oculta o banner e o spinner."
tips.t197: "O salvamento de trajetórias (--save-trajectories) captura rastros completos de uso de ferramentas para treinar modelos."
tips.t198: "Três tipos de plugin: geral (ferramentas/hooks), fornecedores de memória e motores de contexto."
tips.t199: "hermes plugins install owner/repo instala plugins diretamente do GitHub."
tips.t200: "Fornecedores de memória externos: Honcho, Hindsight, Mem0, OpenViking e outros via hermes plugins install."
tips.t201: "Os hooks de plugin incluem pre/post_tool_call, pre/post_llm_call e transform_terminal_output para canonicalizar a saída."
tips.t202: "O cache de prompt (Anthropic) reduz custos ao reutilizar prefixos de prompt do sistema em cache."
tips.t203: "O agente gera títulos de sessão automaticamente em um tópico em segundo plano — sem impacto na latência."
tips.t204: "O roteamento inteligente de modelos pode enviar consultas simples automaticamente a um modelo mais barato."
tips.t205: "Comandos de barra suportam correspondência por prefixo: /h resolve para /help, /mod para /model."
tips.t206: "Arrastar um caminho de arquivo para o terminal anexa imagens automaticamente ou o envia como contexto."
tips.t207: ".worktreeinclude na raiz do repositório lista arquivos ignorados pelo git a copiar para os worktrees."
tips.t208: "hermes acp executa o Hermes como servidor ACP para integração com VS Code, Zed e JetBrains."
tips.t209: "Fornecedores personalizados: salve endpoints nomeados no config.yaml em custom_providers."
tips.t210: "HERMES_EPHEMERAL_SYSTEM_PROMPT injeta um prompt do sistema que nunca é persistido no histórico."
tips.t211: "credential_pool_strategies suporta rotação fill_first, round_robin, least_used e random."
tips.t212: "hermes auth add nous ou hermes auth add openai-codex configura fornecedores baseados em OAuth."
tips.t213: "O servidor de API suporta tanto a Chat Completions quanto a Responses API com estado no servidor."
tips.t214: "tool_preview_length: 0 na configuração mostra caminhos de arquivo completos no feed de atividade do spinner."
tips.t215: "hermes status --deep executa verificações de diagnóstico mais profundas em todos os componentes."
tips.t216: "Tarefas cron podem anexar um script Python (--script) cujo stdout é injetado no prompt como contexto."
tips.t217: "Scripts cron ficam em ~/.hermes/scripts/ e rodam antes do agente — perfeitos para pipelines de coleta de dados."
tips.t218: "prefill_messages_file no config.yaml injeta exemplos few-shot em toda chamada de API, sem nunca salvá-los no histórico."
tips.t219: "SOUL.md substitui completamente a identidade padrão do agente — reescreva-o para tornar o Hermes seu."
tips.t220: "SOUL.md é preenchido automaticamente com uma personalidade padrão na primeira execução. Edite-o para personalizar."
tips.t221: "/compress <focus topic> dedica 60-70% do orçamento do resumo ao seu tema e corta o resto agressivamente."
tips.t222: "A partir da segunda compressão, o compressor atualiza o resumo anterior em vez de começar do zero."
tips.t223: "Antes de reiniciar uma sessão do gateway, o Hermes grava automaticamente fatos importantes na memória em segundo plano."
tips.t224: "network.force_ipv4: true no config.yaml corrige travamentos em servidores com IPv6 quebrado — aplica monkey-patch em socket."
tips.t225: "A ferramenta terminal anota códigos de saída comuns: grep retornando 1 = 'No matches found (not an error)'."
tips.t226: "Comandos de terminal em primeiro plano que falham são repetidos automaticamente até 3 vezes com espera exponencial (2s, 4s, 8s)."
tips.t227: "Comandos sudo simples são reescritos automaticamente para receber SUDO_PASSWORD do .env via pipe — sem prompt interativo."
tips.t228: "Os auxiliares de execute_code exigem importações explícitas: from hermes_tools import json_parse, shell_quote, retry."
tips.t229: "As 7 ferramentas de sandbox de execute_code (web_search, terminal, read/write/search/patch) usam RPC — nunca entram no contexto."
tips.t230: "Ler a mesma região de arquivo 3+ vezes dispara um aviso. Com 4+, é bloqueado de forma rígida para evitar loops."
tips.t231: "write_file e patch detectam se um arquivo foi modificado externamente desde a última leitura e avisam que está desatualizado."
tips.t232: "O formato de patch V4A suporta as diretivas Add File, Delete File e Move File — não apenas Update."
tips.t233: "Servidores MCP podem solicitar completions do LLM via sampling — o agente vira uma ferramenta para o servidor."
tips.t234: "Servidores MCP enviam notifications/tools/list_changed para acionar o novo registro automático de ferramentas sem reiniciar."
tips.t235: "delegate_task com acp_command: 'claude' cria o Claude Code como agente filho a partir de qualquer plataforma."
tips.t236: "A delegação tem um tópico de heartbeat — a atividade do filho é propagada ao pai, evitando tempos limite do gateway."
tips.t237: "Quando um fornecedor retorna HTTP 402 (pagamento necessário), o cliente auxiliar recorre automaticamente ao próximo."
tips.t238: "agent.tool_use_enforcement redireciona modelos que descrevem ações em vez de chamar ferramentas — automático para GPT/Codex."
tips.t239: "agent.restart_after_turn_timeout deixa os turnos em andamento terminarem antes de /restart entrar em stop(); restart_drain_timeout é apenas o orçamento de interrupção forçada depois que stop() começa."
tips.t240: "agent.api_max_retries (padrão 3) controla quantas vezes o agente tenta novamente uma chamada de API que falhou antes de exibir o erro — reduza para um fallback rápido."
tips.t241: "O gateway mantém instâncias de AIAgent em cache por sessão — destruir esse cache quebra o cache de prompt da Anthropic."
tips.t242: "Qualquer site pode expor skills via /.well-known/skills/index.json — o hub de skills as descobre automaticamente."
tips.t243: "O log de auditoria de skills em ~/.hermes/skills/.hub/audit.log registra toda operação de instalação e remoção."
tips.t244: "Worktrees git obsoletos são limpos automaticamente na inicialização: árvores limpas e totalmente mescladas são removidas; trabalho sujo ou não enviado é sempre preservado."
tips.t245: "Perfis delimitam o estado do Hermes via HERMES_HOME; subprocessos de ferramentas do host mantêm seu HOME real, a menos que terminal.home_mode seja profile."
tips.t246: "A variável de ambiente HERMES_HOME_MODE (octal, ex.: 0701) define permissões de diretório personalizadas para travessia pelo servidor web."
tips.t247: "Modo contêiner: coloque .container-mode em HERMES_HOME e a CLI do host executa automaticamente dentro do contêiner."
tips.t248: "Ctrl+C tem 5 níveis de prioridade: cancelar gravação → cancelar prompts → cancelar seletor → interromper agente → sair."
tips.t249: "Toda interrupção durante a execução de um agente é registrada em ~/.hermes/interrupt_debug.log com carimbo de tempo."
tips.t250: "BROWSER_CDP_URL conecta as ferramentas de navegador a qualquer navegador da família Chromium em execução — aceita WebSocket, HTTP ou host:port."
tips.t251: "BROWSERBASE_ADVANCED_STEALTH=true ativa antidetecção avançada com Chromium personalizado (Scale Plan)."
tips.t252: "A CLI muda automaticamente para o modo compacto em terminais com menos de 80 colunas."
tips.t253: "Comandos rápidos suportam dois tipos: exec (executa um comando shell diretamente) e alias (redireciona para outro comando)."
tips.t254: "Modelo de delegação por tarefa: delegation.model e delegation.provider na configuração roteiam subagentes para modelos mais baratos."
tips.t255: "delegation.reasoning_effort controla de forma independente a profundidade de raciocínio dos subagentes."
tips.t256: "display.platforms no config.yaml permite substituições de exibição por plataforma: {telegram: {tool_progress: all}}."
tips.t257: "human_delay.mode na configuração simula a velocidade de digitação humana — intervalo min_ms/max_ms configurável."
tips.t258: "Migrações de versão da configuração rodam automaticamente ao carregar — novas chaves aparecem sem intervenção manual."
tips.t259: "Modelos GPT e Codex recebem orientação especial no prompt do sistema sobre disciplina e uso obrigatório de ferramentas."
tips.t260: "Modelos Gemini recebem diretrizes específicas para caminhos absolutos, chamadas de ferramenta paralelas e comandos não interativos."
tips.t261: "context.engine no config.yaml pode apontar para o nome de um plugin para estratégias alternativas de gestão de contexto."
tips.t262: "Instantâneos de página do navegador com mais de 15.000 caracteres são truncados ou resumidos automaticamente; o instantâneo completo é salvo em cache/web para paginação com read_file."
tips.t263: "O compressor faz uma pré-passagem barata: saídas de ferramenta com mais de 200 caracteres são substituídas por placeholders antes de o LLM rodar."
tips.t264: "Quando a compressão falha, novas tentativas são pausadas por 10 minutos para não sobrecarregar a API."
tips.t265: "Comandos perigosos longos (>70 caracteres) ganham a opção 'view' no prompt de aprovação para ver o texto completo antes."
tips.t266: "A visualização do nível de áudio mostra barras ▁▂▃▄▅▆▇ durante a gravação de voz com base no RMS do microfone."
tips.t267: "Nomes de perfil não podem colidir com binários existentes no PATH — 'hermes profile create ls' seria rejeitado."
tips.t268: "hermes profile create backup --clone-all copia tudo (configuração, chaves, SOUL.md, memórias, skills, sessões)."
tips.t269: "A tecla de gravação de voz é configurável via voice.record_key no config.yaml — não apenas Ctrl+B."
tips.t270: "Arquivos .cursorrules e .cursor/rules/*.mdc são detectados e carregados automaticamente como contexto do projeto."
tips.t271: "Arquivos de contexto são checados contra 10+ padrões de injeção de prompt — Unicode invisível, 'ignore instructions', tentativas de exfiltração."
tips.t272: "GPT-5 e Codex usam o papel 'developer' em vez de 'system' no formato de mensagens."
tips.t273: "Substituições auxiliares por tarefa: auxiliary.vision.provider, auxiliary.compression.model etc. no config.yaml."
tips.t274: "O cliente auxiliar trata 'main' como alias de fornecedor — resolve para o seu fornecedor + modelo primário real."
tips.t275: "hermes claw migrate --dry-run pré-visualiza a migração do OpenClaw sem gravar nada."
tips.t276: "Caminhos de arquivo colados com aspas ou espaços escapados são tratados automaticamente — sem limpeza manual."
tips.t277: "Comandos de barra nunca acionam o recolhimento de colagens grandes — /command com argumentos extensos funciona corretamente."
tips.t278: "No modo de interrupção, comandos de barra digitados durante a execução do agente ignoram a lógica de interrupção e rodam imediatamente."
tips.t279: "HERMES_DEV=1 ignora a detecção de modo contêiner para desenvolvimento local."
tips.t280: "Cada servidor MCP recebe seu próprio conjunto de ferramentas (mcp-servername), que pode ser alternado de forma independente via hermes tools."
tips.t281: "Placeholders ${ENV_VAR} de MCP na configuração são resolvidos ao iniciar o servidor — incluindo variáveis de ~/.hermes/.env."
tips.t282: "Skills de repositórios confiáveis (NousResearch) recebem o nível de segurança 'trusted'; skills da comunidade passam por varredura extra."
tips.t283: "A quarentena de skills em ~/.hermes/skills/.hub/quarantine/ guarda skills aguardando revisão de segurança."
tips.t284: "/steer <prompt> injeta uma nota após a próxima chamada de ferramenta — ajuste a direção no meio da tarefa sem interromper."
tips.t285: "/goal <text> define um objetivo permanente em loop Ralph — o Hermes continua turno após turno até um juiz declarar concluído."
tips.t286: "/snapshot create [label] salva um instantâneo completo da configuração do Hermes; /snapshot restore <id> reverte depois."
tips.t287: "/copy [N] copia a última resposta do assistente para a área de transferência, ou a N-ésima a partir do fim com um número."
tips.t288: "/redraw força um redesenho completo da interface, corrigindo desvios do terminal após redimensionar o tmux ou artefatos de seleção com o mouse."
tips.t289: "/agents (alias /tasks) mostra os agentes ativos e as tarefas em segundo plano em execução na sessão atual."
tips.t290: "/footer alterna o rodapé do gateway nas respostas finais, mostrando modelo, % de contexto e cwd."
tips.t291: "/busy queue|steer|interrupt controla o que Enter faz enquanto o Hermes está trabalhando."
tips.t292: "/topic em DMs do Telegram ativa o modo de tópicos multissessão gerenciado pelo usuário — /topic <id> restaura sessões passadas inline."
tips.t293: "/approve session|always executa um comando perigoso pendente com o escopo de confiança escolhido; /deny o rejeita."
tips.t294: "/restart reinicia o gateway de forma controlada após drenar as execuções ativas e depois avisa quem solicitou quando voltar."
tips.t295: "/kanban boards switch <slug> troca o quadro Kanban multiprojeto ativo de dentro do chat."
tips.t296: "/reload recarrega ~/.hermes/.env na sessão em execução — aplique novas chaves de API sem reiniciar."
tips.t297: "cronjob com no_agent=True executa um script no horário agendado e envia seu stdout diretamente — zero tokens, zero LLM."
tips.t298: "Um stdout vazio no script cron significa tique silencioso — nada é entregue, perfeito para watchdogs de limiar."
tips.t299: "HERMES_CRON_MAX_PARALLEL (padrão 4) limita quantas tarefas cron rodam por tique para que picos não saturem suas chaves."
tips.t300: "Hooks do gateway ficam em ~/.hermes/hooks/<name>/ com HOOK.yaml + handler.py — o handler deve se chamar `handle`."
tips.t301: "Os eventos de hook incluem gateway:startup, session:start, agent:step e assinaturas com curinga command:*."
tips.t302: "Coloque uma lista de verificação em ~/.hermes/BOOT.md e um hook gateway:startup a executa como agente de uma única vez a cada inicialização."
tips.t303: "hermes curator run --dry-run mostra o que o curador arquivaria ou consolidaria sem alterar nada."
tips.t304: "hermes curator pin <skill> protege uma skill tanto do arquivamento automático quanto da ferramenta skill_manage do agente."
tips.t305: "hermes curator rollback restaura skills a partir de um instantâneo anterior à execução — os backups ficam em skills/.curator_backups/."
tips.t306: "hermes auth reset <provider> [target] limpa os tempos de espera e as marcações de esgotamento de um pool inteiro de credenciais, ou de uma única credencial por índice, id ou rótulo."
tips.t307: "credential_pool_strategies.<provider>: round_robin alterna as chaves de forma uniforme em vez do padrão fill_first."
tips.t308: "use_gateway: true por ferramenta roteia web, image, tts ou browser pela sua assinatura Nous — sem chaves extras."
tips.t309: "provider_routing.data_collection: deny exclui fornecedores que armazenam dados no OpenRouter."
tips.t310: "provider_routing.require_parameters: true roteia apenas para fornecedores que suportam todos os parâmetros da sua solicitação."
tips.t311: "HERMES_TUI_RESUME=1 reanexa automaticamente à sessão mais recente da TUI ao iniciar — útil depois de quedas de SSH."
tips.t312: "HERMES_TUI_THEME=light|dark|<hex> força o tema da TUI em terminais que não definem COLORFGBG."
tips.t313: "Ctrl+G ou Ctrl+X Ctrl+E na TUI abre o buffer de entrada no $EDITOR para prompts longos com várias linhas."
tips.t314: "A TUI renderiza LaTeX em linha — $E=mc^2$ vira notação matemática Unicode em vez de TeX bruto."
tips.t315: "hermes dashboard inicia uma interface web local em 127.0.0.1:9119 — nenhum dado sai do localhost."
tips.t316: "hermes dashboard incorpora a TUI completa do Hermes no seu navegador via xterm.js e um PTY por WebSocket."
tips.t317: "Coloque um YAML em ~/.hermes/dashboard-themes/ com duas cores de paleta para mudar o visual de todo o painel."
tips.t318: "Os plugins do painel são drop-in: manifest.json + bundle JS em ~/.hermes/dashboard-plugins/ — sem precisar de build com npm."
tips.t319: "layoutVariant: cockpit em um tema do painel adiciona uma barra lateral esquerda de 260px que os plugins podem preencher pelo slot sidebar."
tips.t320: "display.tool_progress_command: true expõe /verbose nas plataformas de mensagens; por padrão, ele é exclusivo da CLI."
tips.t321: "HERMES_BACKGROUND_NOTIFICATIONS=result só avisa quando tarefas em segundo plano terminam (em vez de concise/all/error/off)."
tips.t322: "HERMES_WRITE_SAFE_ROOT restringe write_file/patch a prefixos de diretório; vários caminhos via os.pathsep (: ou ;)."
tips.t323: "HERMES_IGNORE_RULES pula a injeção automática de AGENTS.md, SOUL.md, .cursorrules, memória e skills pré-carregadas."
tips.t324: "HERMES_ACCEPT_HOOKS aprova automaticamente hooks de shell inéditos declarados em config.yaml sem pedir confirmação no TTY."
tips.t325: "auxiliary.goal_judge.model roteia o juiz do /goal para um modelo barato e rápido, mantendo o custo do loop perto de zero."
tips.t326: "Os checkpoints ignoram diretórios com mais de 50.000 arquivos para evitar operações git lentas em monorepos enormes."
tips.t327: "tts.provider: piper executa TTS local em 44 idiomas na CPU — as vozes são baixadas automaticamente para ~/.hermes/cache/piper-voices/."
tips.t328: "tts.providers.<name>.type: command conecta qualquer motor de TTS de linha de comando usando os placeholders {input_path} e {output_path}."
tips.t329: "API_SERVER_ENABLED=true executa um endpoint compatível com OpenAI junto ao gateway, para Open WebUI e LibreChat."
tips.t330: "GATEWAY_PROXY_URL cria uma configuração dividida: E/S das plataformas localmente, trabalho do agente delegado a um servidor de API remoto."
tips.t331: "MATRIX_DEVICE_ID fixa um ID de dispositivo estável para E2EE — sem ele, as chaves rotacionam a cada início e a descriptografia do histórico quebra."
tips.t332: "TELEGRAM_WEBHOOK_SECRET é obrigatório sempre que TELEGRAM_WEBHOOK_URL estiver definido — gere com openssl rand -hex 32."
tips.t333: "batch_runner.py --resume identifica prompts concluídos pelo conteúdo do texto, para que reordenações do dataset não refaçam trabalho já terminado."
tips.t334: "/new inicia uma sessão nova no lugar (alias /reset) — novo ID de sessão, histórico limpo, e a CLI continua aberta."
tips.t335: "/clear limpa a tela do terminal E inicia uma nova sessão — um único atalho para um reset visual."
tips.t336: "/history imprime a conversa atual em linha sem sair da CLI — útil para uma releitura rápida."
tips.t337: "/save grava a conversa atual em disco sem encerrar a sessão."
tips.t338: "/status mostra as informações da sessão de uma olhada: ID, título, modelo, uso de tokens e tempo decorrido."
tips.t339: "/image <path> anexa um arquivo de imagem local ao seu próximo prompt sem colar nem arrastar e soltar."
tips.t340: "/platforms mostra o status de conexão do gateway e das plataformas de mensagens direto de dentro do chat."
tips.t341: "/commands pagina a lista completa de comandos slash + skills instaladas — útil em plataformas sem autocompletar por Tab."
tips.t342: "/toolsets lista todos os conjuntos de ferramentas disponíveis para você saber o que -t/--toolsets aceita."
tips.t343: "/voice tts alterna o modo somente TTS — o agente responde em voz alta, mas você continua digitando seus prompts."
tips.t344: "/reload-skills verifica novamente ~/.hermes/skills/ para que skills adicionadas apareçam sem reiniciar a sessão."
tips.t345: "/indicator kaomoji|emoji|unicode|ascii escolhe o estilo do indicador de ocupado da TUI mostrado durante as execuções do agente."
tips.t346: "/debug envia um pacote de suporte (informações do sistema + logs) e retorna links compartilháveis — funciona no chat também."
tips.t347: "hermes -z \"<prompt>\" é o modo one-shot mais puro: só a resposta final no stdout, nada mais — ideal para pipes em scripts."
tips.t348: "hermes chat --pass-session-id injeta o ID da sessão no prompt do sistema para que o agente possa referenciá-lo."
tips.t349: "hermes chat --image path/to/pic.png anexa uma imagem local a uma única consulta -q sem uma etapa separada de envio."
tips.t350: "hermes chat --ignore-user-config ignora a configuração ativa do usuário — relatórios de bug reproduzíveis e execuções em CI."
tips.t351: "hermes chat --source tool marca chats programáticos para que eles não poluam hermes sessions list."
tips.t352: "hermes dump --show-keys inclui impressões digitais ocultadas das chaves de API para uma depuração de suporte mais profunda."
tips.t353: "hermes sessions rename <ID> \"new title\" renomeia qualquer sessão passada; hermes sessions delete <ID> remove uma."
tips.t354: "hermes import restaura um zip de backup completo do Hermes; exportações de sessão em JSON/JSONL são importadas pela página Sessões do painel."
tips.t355: "hermes fallback gerencia a cadeia fallback_model de forma interativa — sem editar config.yaml à mão."
tips.t356: "hermes pairing rotaciona o token de pareamento por DM — a primeira pessoa a enviar mensagem após a rotação obtém acesso ao bot."
tips.t357: "hermes setup guia usuários iniciantes pela configuração de fornecedor, chaves e plataformas em um único fluxo interativo."
tips.t358: "hermes status --deep executa a verificação completa de saúde em todos os componentes; hermes status simples é a visão rápida."
tips.t359: "HERMES_AGENT_TIMEOUT=0 desativa o encerramento por inatividade do gateway para um agente em execução — use em pesquisas longas."
tips.t360: "HERMES_ENABLE_PROJECT_PLUGINS=1 carrega automaticamente plugins locais do repositório em ./.hermes/plugins/ — protegido por confiança por design."
tips.t361: "HERMES_DISABLE_FILE_STATE_GUARD=1 desliga a proteção 'arquivo alterado desde a leitura' em patch e write_file."
tips.t362: "HERMES_ALLOW_PRIVATE_URLS=true permite que as ferramentas web acessem localhost e redes privadas — desativado por padrão no modo gateway."
tips.t363: "HERMES_OPTIONAL_SKILLS=name1,name2 instala automaticamente skills extras do catálogo opcional na primeira execução de cada perfil."
tips.t364: "HERMES_BUNDLED_SKILLS aponta para uma árvore personalizada de skills embutidas — usado pelos pacotes do Homebrew e do Nix."
tips.t365: "HERMES_DUMP_REQUEST_STDOUT=1 despeja o payload de cada solicitação à API no stdout em vez de em arquivos de log."
tips.t366: "HERMES_OAUTH_TRACE=1 registra, com dados ocultados, as trocas e renovações de token OAuth para depurar a autenticação de fornecedores."
tips.t367: "HERMES_STREAM_RETRIES (padrão 3) controla as tentativas de reconexão no meio do stream em erros de rede transitórios."
tips.t368: "HERMES_GATEWAY_BUSY_ACK_ENABLED=false silencia as mensagens de confirmação ⚡/⏳/⏩ quando um usuário escreve para um agente ocupado."
tips.t369: "HERMES_AGENT_NOTIFY_INTERVAL (padrão 180s) define com que frequência o gateway envia atualizações de progresso em turnos longos."
tips.t370: "HERMES_RESTART_DRAIN_TIMEOUT (padrão 900s) limita quanto tempo /restart espera pelas execuções em andamento antes de forçar."
tips.t371: "HERMES_CHECKPOINT_TIMEOUT (padrão 30s) limita a criação de checkpoints do sistema de arquivos — aumente em monorepos enormes."
tips.t372: "image_gen.model em config.yaml escolhe o modelo FAL: flux-2/klein, gpt-image-2, nano-banana-pro e outros."
tips.t373: "image_gen.provider roteia a geração de imagens por um plugin (OpenAI Images, Codex, FAL) em vez do padrão."
tips.t374: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY apontam a análise de visão para qualquer endpoint compatível com OpenAI."
tips.t375: "API_SERVER_MODEL_NAME personaliza o nome do modelo em /v1/models — essencial para configurações do Open WebUI com vários perfis."
tips.t376: "Os plugins do painel são servidos em /dashboard-plugins/<name>/ — coloque os arquivos em ~/.hermes/dashboard-plugins/."
tips.t377: "Chats com --source tool ficam fora de hermes sessions list por padrão — defina --source explicitamente para vê-los."
