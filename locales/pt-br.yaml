gateway.topic.help: "/topic — ativa o modo DM multissessão (um bot, vários chats paralelos)\n\nUso:\n  /topic             Ativa o modo de tópicos ou mostra o status se já estiver ativo\n  /topic help        Mostra esta mensagem\n  /topic off         Desativa o modo de tópicos e limpa os vínculos de tópicos\n  /topic <id>        Dentro de um tópico: restaura uma sessão anterior pelo ID\n\nComo funciona:\n1. Execute /topic uma vez nesta DM — o Hermes verifica se Threads\n   Settings está ativado no BotFather e liga o modo multissessão.\n2. Toque em All Messages no topo do bot e envie qualquer mensagem.\n   O Telegram cria um novo tópico para essa mensagem; cada tópico é\n   uma sessão independente do Hermes (histórico e contexto novos).\n3. A DM raiz vira um lobby do sistema — envie /topic, /status,\n   /help, /usage lá. Prompts normais vão em um tópico.\n4. /new dentro de um tópico reinicia apenas a sessão daquele tópico.\n5. /topic <id> dentro de um tópico restaura uma sessão antiga nele."
gateway.topic.mode_disabled: "O modo de tópicos multissessão agora está OFF para este chat.\n\nOs tópicos existentes no Telegram não são removidos — eles apenas deixam de ser tratados como sessões independentes. A DM raiz volta a funcionar como um chat normal do Hermes. Execute /topic para reativar depois."
